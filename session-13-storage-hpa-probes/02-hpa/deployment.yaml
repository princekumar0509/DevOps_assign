apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: session13
  labels:
    app: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        # CPU-bound PHP app from the official Kubernetes HPA walkthrough:
        # every request runs a loop, so CPU really follows traffic.
        # (a static nginx page was tried first - see nginx-attempt/)
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m        # HPA utilisation is measured against this
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
