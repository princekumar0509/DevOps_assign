# Three busybox workers hammering the Service in a tight loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: session13
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: wget-loop
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 500m
