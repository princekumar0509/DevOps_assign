# Two containers in one Pod share a scratch directory.
# emptyDir is created when the Pod is scheduled and deleted with the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: session13
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date -u +%T) written by writer\" >> /cache/log.txt; sleep 5; done"]
      volumeMounts:
        - name: shared-cache
          mountPath: /cache
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared-cache
          mountPath: /shared        # same volume, different path
          readOnly: true
  volumes:
    - name: shared-cache
      emptyDir:
        sizeLimit: 50Mi
