# Dynamic provisioning: no PV exists yet; the provisioner creates one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-claim
  namespace: session13
spec:
  storageClassName: local-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: default-class-claim         # no storageClassName -> cluster default
  namespace: session13
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
