# hostPath mounts a directory from the node's own filesystem.
# Data outlives the Pod, but only on that one node - and it gives the Pod
# access to the host, so it is avoided for normal application workloads.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: session13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"hello from pod $(hostname) at $(date -u +%T)\" >> /host-data/visits.txt; sleep 3600"]
      volumeMounts:
        - name: node-dir
          mountPath: /host-data
  volumes:
    - name: node-dir
      hostPath:
        path: /var/session13-hostpath
        type: DirectoryOrCreate
