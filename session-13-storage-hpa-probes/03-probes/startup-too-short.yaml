# Same app, but the startup budget (3 x 5s = 15s) is shorter than the 30s boot.
# The kubelet gives up and restarts the container before it ever starts.
apiVersion: v1
kind: Pod
metadata:
  name: startup-too-short
  namespace: session13
  labels:
    demo: startup-probe
spec:
  containers:
    - name: slow-app
      image: nginx:1.27-alpine
      command: ["sh", "-c", "echo 'warming up for 30s'; sleep 30; exec nginx -g 'daemon off;'"]
      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 3
