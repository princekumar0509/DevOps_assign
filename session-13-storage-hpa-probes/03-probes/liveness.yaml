# Liveness decides whether a container is still healthy. Failing it restarts
# the container. The app "breaks" 25s after start by deleting its health file.
apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  namespace: session13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "touch /tmp/healthy; echo started; sleep 25; rm /tmp/healthy; echo 'simulating a hang'; sleep 600"]
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
