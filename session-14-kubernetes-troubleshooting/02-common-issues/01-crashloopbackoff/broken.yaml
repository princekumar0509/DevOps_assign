# BUG: the app refuses to start without DATABASE_URL, and none is provided.
apiVersion: v1
kind: Pod
metadata:
  name: orders-worker
  namespace: session14
spec:
  containers:
    - name: worker
      image: python:3.12-alpine
      command:
        - python3
        - -c
        - |
          import os, sys, time
          db = os.environ.get("DATABASE_URL")
          if not db:
              print("[FATAL] DATABASE_URL environment variable is missing", file=sys.stderr)
              sys.exit(1)
          print(f"orders-worker started, using {db}", flush=True)
          while True:
              time.sleep(30)
