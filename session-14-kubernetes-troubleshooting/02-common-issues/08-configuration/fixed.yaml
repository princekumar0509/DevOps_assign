apiVersion: v1
kind: Pod
metadata:
  name: billing
  namespace: session14
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"log level=$LOG_LEVEL currency=$CURRENCY db_user=$DB_USER\"; sleep 3600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: billing-config
              key: LOG_LEVEL          # FIX 1: the real key name
        - name: CURRENCY
          valueFrom:
            configMapKeyRef:
              name: billing-config
              key: CURRENCY
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials    # FIX 2: created with kubectl, not committed to Git
              key: username
