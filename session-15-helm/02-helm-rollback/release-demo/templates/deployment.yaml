apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release-demo.fullname" . }}
  labels:
    {{- include "release-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "release-demo.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below the desired count during an upgrade
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "release-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.release.version | quote }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            periodSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: {{ include "release-demo.fullname" . }}-page-r{{ .Release.Revision }}
